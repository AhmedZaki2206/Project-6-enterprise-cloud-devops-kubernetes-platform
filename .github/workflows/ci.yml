name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: enterprise-platform:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-platform:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.10.3}
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          framework: terraform
          skip_check: CKV2_AWS_11,CKV2_AWS_5
      - uses: azure/setup-helm@v4
        with: {version: v3.16.4}
      - run: helm lint helm/enterprise-platform
      - run: helm template enterprise-platform helm/enterprise-platform --namespace enterprise-platform > rendered.yaml
      - name: Validate rendered Kubernetes manifests
        run: docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /work/rendered.yaml
      - run: pipx install ansible-core==2.18.1
      - run: ansible-playbook --syntax-check site.yml -i inventory.ini
        working-directory: ansible
      - name: Documentation references
        run: test -f README.md && test -f docs/STEP_BY_STEP_GUIDE.md && test -f docs/architecture/architecture.svg

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application, infrastructure]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/enterprise-platform:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
