apiVersion: v1
kind: Namespace
metadata: {name: incident-09}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rollout-lab, namespace: incident-09}
spec:
  replicas: 2
  progressDeadlineSeconds: 30
  selector: {matchLabels: {app: rollout-lab}}
  template:
    metadata: {labels: {app: rollout-lab}}
    spec:
      containers:
        - name: web
          image: nginx:1.27.3-alpine
          readinessProbe: {httpGet: {path: /never-ready, port: 80}, periodSeconds: 3}
