apiVersion: v1
kind: Namespace
metadata: {name: incident-10}
---
apiVersion: v1
kind: Service
metadata: {name: missing-backend, namespace: incident-10}
spec: {selector: {app: absent}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: broken-route, namespace: incident-10}
spec:
  ingressClassName: nginx
  rules:
    - host: broken.enterprise.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: missing-backend, port: {number: 80}}}
