apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enterprise-platform.fullname" . }}-config
  labels:
    {{- include "enterprise-platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.environment | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
